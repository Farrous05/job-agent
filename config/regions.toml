# Region presets. config/profile.toml picks which ones you accept ([regions] accept = [...])
# and your work rights in each ([work_rights]). Matching is whole-word and case-insensitive.
# `iso` = ISO country codes used for the freehire aggregator search.
# Add cities if postings in your area use only a city name.

[uk]
label = "UK"
iso = ["gb"]
words = ["united kingdom", "uk", "england", "scotland", "wales", "northern ireland", "great britain", "gb",
         "london", "manchester", "birmingham", "leeds", "glasgow", "edinburgh", "bristol", "cambridge",
