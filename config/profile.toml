# Your preferences. The fetcher (python3 -m jobagent) and the Claude Code
# commands (.claude/commands/*.md) both read this file.

[profile]
name = "Fares Shretah"
cv_path = "cv/cv.tex"
graduation = "2027-09"          # MSc ML, UCL
target_start = "2027 autumn"
home_city = "London"
languages = ["en", "fr", "ar"]  # postings in, or requiring, other languages rank lower
# Companies you've already applied to: their roles stay in the list, marked "already applied".
already_applied = ["Bloomberg", "Data Reply", "G-Research", "G Research", "PwC"]

[work_rights]
# UK: student visa now. A UK role passes only if it sponsors (Skilled Worker)
# OR accepts the Graduate visa. Unknown status is kept but flagged.
# Note: Graduate visa is 18 months for applications made from 1 Jan 2027.
uk_needs_sponsorship_or_graduate_visa = true
# EU/EEA/Switzerland: French passport, no sponsorship needed.
eu_free = true

[locations]
# Substring match on the job's location (case-insensitive).
uk = ["london", "united kingdom", "uk", "england"]
eu = [# countries and regions (EU + EEA + Switzerland)
      "europe", "emea", "eu", "france", "netherlands", "germany", "ireland", "switzerland", "spain", "portugal",
      "italy", "sweden", "denmark", "poland", "austria", "belgium", "luxembourg", "finland", "norway", "czechia",
      "czech republic", "romania", "hungary", "bulgaria", "greece", "croatia", "slovenia", "slovakia", "estonia",
      "latvia", "lithuania", "cyprus", "malta", "iceland", "liechtenstein",
      # cities (for postings that give only a city)
      "paris", "lyon", "toulouse", "grenoble", "nice", "sophia antipolis", "lille", "bordeaux", "nantes", "montpellier",
      "amsterdam", "rotterdam", "eindhoven", "utrecht", "the hague", "delft", "veldhoven",
      "berlin", "munich", "münchen", "hamburg", "frankfurt", "cologne", "köln", "stuttgart", "düsseldorf", "leipzig",
      "heidelberg", "karlsruhe", "tübingen", "darmstadt", "leonberg",
      "dublin", "cork", "galway", "zurich", "zürich", "geneva", "lausanne", "basel", "zug", "bern",
      "madrid", "barcelona", "valencia", "seville", "malaga", "lisbon", "porto", "milan", "rome", "turin", "bologna",
      "stockholm", "gothenburg", "malmö", "copenhagen", "aarhus", "oslo", "bergen", "trondheim", "helsinki", "espoo",
      "warsaw", "krakow", "kraków", "wroclaw", "wrocław", "gdansk", "vienna", "brussels", "antwerp", "ghent", "leuven",
      "prague", "brno", "bucharest", "cluj", "budapest", "sofia", "athens", "zagreb", "ljubljana", "bratislava",
      "tallinn", "riga", "vilnius", "limassol", "valletta", "reykjavik"]
# City priority: every city in your regions is allowed, but bigger hubs rank higher.
# Score bonus per tier (best tier among a posting's locations wins; remote = 0).
city_weights = { preferred = 2.0, hub = 1.5, major = 0.5, other = -1.0 }
[locations.city_tiers]
preferred = ["london"]
hub = ["paris", "amsterdam", "berlin", "munich", "münchen", "zurich", "zürich", "dublin"]
major = ["madrid", "barcelona", "milan", "stockholm", "copenhagen", "brussels", "vienna", "lisbon", "frankfurt",
         "hamburg", "geneva", "warsaw", "prague", "helsinki", "oslo", "rotterdam", "eindhoven", "lyon",
         "cambridge", "oxford", "edinburgh", "manchester", "bristol", "zug", "lausanne"]

[filters]
# PhD is handled separately: a role is dropped only if it is PhD-only (titles or text that also
# accept a Master's, e.g. "PhD/Masters", are kept).
exclude_title_words = ["senior", "sr.", "sr ", "lead", "staff", "principal", "manager",
                       "director", "head of", "vp", "vice president", "architect",
                       "mid-level", "experienced", "hardware", "fpga",
                       "trading support", "sales", "recruiter", "consultant", "value engineer",
                       "business developer", "apprentice", "trading days", "insight", "kickstarter",
                       "futurefocus", "open day", "spring week", "surveyor", "civil engineer",
                       "structural engineer", "mechanical engineer", "electrical engineer", "quality engineer"]
max_years_experience = 2        # "3+ years" and "2-3 years" are excluded; "1-3 years" is kept
exclude_summer_internships = true   # summer 2027 clashes with the MSc dissertation (visa)
exclude_graduation_years = ["2028", "2029"]   # roles for later grads

[ranking]
# Role families (title match) and their weight.
families = { ml = 10, ai = 10, data_science = 8, quant = 8, software = 6 }
# Company quality tiers (ranking tie-breaker, not a filter).
tier1 = ["Google DeepMind", "DeepMind", "Anthropic", "OpenAI", "Jane Street", "Hudson River Trading",
         "HRT", "XTX Markets", "Citadel", "Optiver", "G-Research", "Two Sigma", "Jump Trading",
         "Isomorphic Labs", "Mistral AI", "Palantir", "Qube", "Squarepoint", "IMC", "DRW",
         "Wayve", "ElevenLabs", "Hugging Face", "Databricks", "Stripe", "NVIDIA", "Meta", "Google"]
tier2 = ["Revolut", "Monzo", "Wise", "Bloomberg", "Cohere", "Synthesia", "PolyAI", "Faculty",
         "Helsing", "Graphcore", "Datadog", "Cloudflare", "Tower Research", "Man Group",
         "Spotify", "Arm", "Criteo", "Booking.com", "Adyen", "Celonis", "DeepL",
         "Poolside", "Flow Traders", "Dataiku", "Doctolib", "Mollie", "N26", "Wolt", "SAP", "Zalando", "ASML",
         "ARM", "Ericsson", "UBS", "Techwolf"]

[freehire]
# Aggregator search across ~185k companies (startups included). Free: 120 requests/min, 2,000/day.
enabled = true
open_within_days = 30      # only postings first seen in the last N days
pages = 6                  # 50 results per page per query (6 pages x 7 queries = max 42 requests)
countries = ["gb", "fr", "nl", "de", "ie", "ch", "es", "pt", "it", "be", "lu", "at", "dk", "se", "fi",
             "no", "pl", "cz"]
# max 5 OR alternatives per query (API limit)
queries = [
  { q = '"machine learning" OR "ML engineer" OR "AI engineer" OR "LLM"', seniority = ["junior", "intern"] },
  { q = '"data scientist" OR "research engineer" OR "applied scientist"', seniority = ["junior", "intern"] },
  { q = 'quantitative OR quant OR "software engineer" OR "software developer"', seniority = ["junior"] },
  { q = '"deep learning" OR NLP OR "computer vision" OR "AI researcher"', seniority = ["junior", "intern"] },
  { q = '"python developer" OR "backend engineer" OR "data engineer"', seniority = ["junior"] },
  { q = 'graduate OR "new grad" OR "early careers" OR "2027"' },
  { q = '"graduate programme" OR "graduate scheme" OR "university graduate"' },
]
# Every role at these companies (they have no public job board we can read directly). freehire slugs.
company_slugs = ["jane-street", "squarepoint-capital", "qube-research-technologies", "tower-research-capital",
                 "mistral-ai", "deepmind", "g-research", "revolut", "bloomberg", "pwc", "hugging-face",
                 "booking-com", "zalando", "criteo", "asml", "sap", "man-group", "xtx-markets"]
company_pages = 6

[scoring]
# Claude scores EVERY role that passes the filters (fit 1-5 against your CV), in batches.
# Scores are cached in data/score_cache.json, so a role is only scored once.
batch_size = 25
min_fit_shortlist = 3      # shortlist = best roles with fit >= this

[linkedin]
# Read-only LinkedIn JOB search in your Chrome during /job-run (never applies, never messages).
# LinkedIn's terms forbid automated scraping, so this stays small and supervised.
jobs_search = true
max_searches = 3
max_results = 60

[output]
shortlist_size = 15
candidates_size = 80            # pool handed to Claude for the final ranking
