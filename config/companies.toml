# Company job boards fetched by `python3 -m jobagent`.
#
# Each board token is the slug in the company's careers URL:
#   greenhouse: job-boards.greenhouse.io/<token>       (API: boards-api.greenhouse.io/v1/boards/<token>/jobs)
#   lever:      jobs.lever.co/<token>                  (API: api.lever.co/v0/postings/<token>)
#   ashby:      jobs.ashbyhq.com/<token>               (API: api.ashbyhq.com/posting-api/job-board/<token>)
#   workday:    <tenant>.wd<N>.myworkdayjobs.com/<site> (API: POST .../wday/cxs/<tenant>/<site>/jobs)
#   smartrecruiters: jobs.smartrecruiters.com/<token>
#
# verified = true means the board returned jobs in a live fetch (3 Nov 2026).
# Unverified tokens are best guesses. After each run, data/source_status.json lists the boards
# that failed (404 etc.). Fix or delete those entries.
#
# Companies with no public ATS feed (Jane Street, Bloomberg, Revolut, Two Sigma, PwC, Data Reply,
# Tower, Squarepoint, Qube...) are under [[watch]] at the bottom. The Claude Code /job-run command
# checks them with web search.

